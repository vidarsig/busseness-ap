[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/create-checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200

[[redirects]]
  from = "/api/stripe-connect"
  to = "/.netlify/functions/stripe-connect"
  status = 200

# Clean URL for the public info / marketing page
[[redirects]]
  from = "/kynning"
  to = "/kynning.html"
  status = 200

# Clean URL for the hub page (videos / photos / reviews / ask-AI)
[[redirects]]
  from = "/hub"
  to = "/hub.html"
  status = 200

# Clean URL for the English marketing / landing page
[[redirects]]
  from = "/welcome"
  to = "/welcome.html"
  status = 200

[[edge_functions]]
  path = "/api/claude-stream"
  function = "claude-stream"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
