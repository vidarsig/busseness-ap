name: Build Android APK

on:
  workflow_dispatch:          # run manually from GitHub Actions tab
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses || true

      # ── Keystore setup ────────────────────────────────────────────
      - name: Set up signing keystore
        working-directory: android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Restoring keystore from secret…"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore
          else
            echo "No KEYSTORE_BASE64 secret — generating a fresh keystore…"
            keytool -genkeypair \
              -v \
              -keystore android.keystore \
              -alias jobboks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass jobboks123 \
              -keypass jobboks123 \
              -dname "CN=Jobboks, OU=Dev, O=Jobboks, L=Reykjavik, ST=IS, C=IS"
          fi

      - name: Print signing fingerprint
        working-directory: android
        run: |
          echo "=== SHA-256 fingerprint (copy this into assetlinks.json) ==="
          keytool -list -v \
            -keystore android.keystore \
            -alias jobboks \
            -storepass jobboks123 2>/dev/null \
            | grep "SHA256:"
          echo "==="
          echo ""
          echo "=== Save this as GitHub secret KEYSTORE_BASE64 ==="
          base64 -w 0 android.keystore
          echo ""
          echo "==="

      # ── Copy launcher icons from web assets ───────────────────────
      - name: Set up launcher icons
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$density
            cp public/icon-192.png android/app/src/main/res/mipmap-$density/ic_launcher.png
            cp public/icon-192.png android/app/src/main/res/mipmap-$density/ic_launcher_round.png
          done

      # ── Gradle build ──────────────────────────────────────────────
      - name: Install Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.4 || \
          curl -L https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip && \
          unzip -q gradle.zip && \
          mv gradle-8.4 /tmp/gradle && \
          export PATH="/tmp/gradle/bin:$PATH" && \
          gradle wrapper
          chmod +x gradlew

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: android.keystore
          STORE_PASSWORD: jobboks123
          KEY_ALIAS: jobboks
          KEY_PASSWORD: jobboks123
        run: ./gradlew assembleRelease --stacktrace

      - name: Find built APK
        run: find android -name "*.apk" | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jobboks-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
