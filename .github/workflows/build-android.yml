name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install Gradle 8.4 directly (avoids GitHub cache service issues)
      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.4/bin" >> $GITHUB_PATH

      # Accept SDK licences and install needed components
      # (Android SDK is pre-installed on ubuntu-latest at $ANDROID_HOME)
      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" \
            "platforms;android-34" 2>/dev/null || true

      # ── Signing keystore ──────────────────────────────────────────
      - name: Set up keystore
        working-directory: android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using saved keystore from secret"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore
          else
            echo "Generating new keystore (first run)"
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias jobboks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass jobboks123 -keypass jobboks123 \
              -dname "CN=Jobboks,O=Jobboks,L=Reykjavik,C=IS"
          fi

      - name: Save keystore info as downloadable files
        working-directory: android
        run: |
          mkdir -p keystore-info
          FP=$(keytool -list -v \
            -keystore android.keystore \
            -alias jobboks \
            -storepass jobboks123 2>/dev/null | grep "SHA256:" | awk '{print $2}')

          echo "$FP" > keystore-info/fingerprint.txt
          base64 -w 0 android.keystore > keystore-info/KEYSTORE_BASE64.txt

          cat > keystore-info/INSTRUCTIONS.txt << EOF
          ========================================
          JOBBOKS ANDROID KEYSTORE — SAVE THIS!
          ========================================

          SHA-256 Fingerprint (goes in assetlinks.json):
          $FP

          HOW TO SAVE THE KEYSTORE PERMANENTLY:
          1. Go to github.com/vidarsig/busseness-ap
          2. Settings → Secrets and variables → Actions
          3. New repository secret
             Name:  KEYSTORE_BASE64
             Value: (contents of KEYSTORE_BASE64.txt — one long line)
          4. Click Add secret

          Future builds will reuse this key automatically.
          WARNING: If you lose this key, you cannot update the app on Play Store!
          EOF

          echo "Fingerprint: $FP"

      # ── Copy icons from web assets ────────────────────────────────
      - name: Copy launcher icons
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp public/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp public/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

      # ── Build ─────────────────────────────────────────────────────
      - name: Build release APK
        working-directory: android
        env:
          STORE_PASSWORD: jobboks123
          KEY_ALIAS: jobboks
          KEY_PASSWORD: jobboks123
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Confirm APK was created
        run: |
          APK=$(find android -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "ERROR: No APK found!"; exit 1; fi
          echo "APK built: $APK ($(du -h $APK | cut -f1))"

      # ── Auto-update assetlinks.json ───────────────────────────────
      - name: Update assetlinks.json with fingerprint
        run: |
          FP=$(cat android/keystore-info/fingerprint.txt)
          printf '[{\n  "relation": ["delegate_permission/common.handle_all_urls"],\n  "target": {\n    "namespace": "android_app",\n    "package_name": "app.jobboks.twa",\n    "sha256_cert_fingerprints": ["%s"]\n  }\n}]\n' "$FP" > public/.well-known/assetlinks.json
          echo "assetlinks.json updated: $FP"

      - name: Commit assetlinks.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.well-known/assetlinks.json
          git diff --cached --quiet || \
            git commit -m "chore: update assetlinks.json fingerprint [skip ci]" && \
            git push

      # ── Upload artifacts ──────────────────────────────────────────
      - name: Upload keystore info
        uses: actions/upload-artifact@v4
        with:
          name: keystore-info
          path: android/keystore-info/
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jobboks-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
