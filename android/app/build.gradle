apply plugin: 'com.android.application'

android {
    compileSdkVersion 35
    namespace 'app.jobboks.twa'

    defaultConfig {
        applicationId "app.jobboks.twa"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 5
        versionName "1.2.2"
    }

    signingConfigs {
        release {
            storeFile rootProject.file('android.keystore')
            storePassword 'jobboks123'
            keyAlias 'jobboks'
            keyPassword 'jobboks123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
