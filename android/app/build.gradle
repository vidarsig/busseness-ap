plugins {
    id 'com.android.application'
}

android {
    namespace 'app.jobboks.twa'
    compileSdk 34

    defaultConfig {
        applicationId "app.jobboks.twa"
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'android.keystore')
            storePassword System.getenv('STORE_PASSWORD') ?: 'jobboks123'
            keyAlias System.getenv('KEY_ALIAS') ?: 'jobboks'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'jobboks123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
